name: Feature request
description: Propose a focused learning or simulator improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: learning_problem
    attributes:
      label: Learning problem
      description: What concept is difficult to understand or explore today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the interaction or explanation you would add.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Mathematical or educational basis
      description: Include equations, references, or examples when relevant.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing request.
          required: true
        - label: I have described the learner outcome, not only the UI.
          required: true
